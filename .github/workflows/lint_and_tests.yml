---
name: Lint and Tests

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

  tests:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Install dependencies
        run: go mod download

      - name: Go tests
        run: go test ./... -v
